sonar.projectName=transcribe-web
sonar.projectKey=transcribe-web
sonar.language=ts
# Next.js App Router layout: there is no single src/ root.
sonar.sources=app,components,hooks,lib,providers
sonar.tests=tests
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
# vitest writes lcov only because vitest.config.ts lists the "lcov" reporter.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
