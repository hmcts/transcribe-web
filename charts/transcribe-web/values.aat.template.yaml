nodejs:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    # Also mounted from Key Vault (values.yaml), which is how the pods Flux
    # deploys get it. An env var wins over the mounted file (start.js), and
    # both hold the same value.
    APPLICATIONINSIGHTS_CONNECTION_STRING: ${APP_INSIGHTS_CONNECTION_STRING}
    AZURE_AD_CLIENT_ID: 18996d70-494e-4ddb-9ebd-17b4a1077314
