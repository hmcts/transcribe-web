nodejs:
  image: 'hmctsprod.azurecr.io/transcribe/web:pr-${CHANGE_ID}'
  ingressHost: transcribe-web-pr-${CHANGE_ID}.preview.platform.hmcts.net
  environment:
    BACKEND_INTERNAL_URL: https://transcribe-api-pr-${CHANGE_ID}.preview.platform.hmcts.net
    NEXT_PUBLIC_API_URL: https://transcribe-web-pr-${CHANGE_ID}.preview.platform.hmcts.net
    APPLICATIONINSIGHTS_CONNECTION_STRING: ${APP_INSIGHTS_CONNECTION_STRING}
    # Preview environments have no Easy Auth in front of them, so gating
    # /recording and /admin on it would make both areas unreachable.
    EASY_AUTH_ENABLED: 'false'
